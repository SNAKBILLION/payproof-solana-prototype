name: Verify and publish PayProof

on:
  push:
    branches:
      - source-v4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: payproof-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test protocol and rendered application
        run: pnpm test

      - name: Build GitHub Pages export
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /payproof-solana-prototype
        run: pnpm build

      - name: Package static export
        shell: bash
        run: |
          export_index="$(find . -maxdepth 5 -type f -name index.html ! -path './node_modules/*' ! -path './.git/*' ! -path './_not-found/*' ! -path '*/404/*' | head -n 1)"
          if [ -z "$export_index" ]; then
            echo "No static index.html was produced."
            exit 1
          fi
          export_root="$(dirname "$export_index")"
          echo "Packaging GitHub Pages export from $export_root"
          mkdir -p pages-artifact
          cp -R "$export_root"/. pages-artifact/
          test -f pages-artifact/index.html
          grep -q "PayProof | Invisible Commerce Proof Network" pages-artifact/index.html

          # Vinext currently emits root-relative Vite assets. GitHub project Pages
          # hosts them below the repository path, so make that boundary explicit.
          find pages-artifact -type f -name '*.html' -exec             sed -i               -e 's|"/assets/|"/payproof-solana-prototype/assets/|g'               -e 's|"/_next/|"/payproof-solana-prototype/_next/|g' {} +
          grep -Eq '/payproof-solana-prototype/(assets|_next)/' pages-artifact/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy verified build
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed site
        shell: bash
        run: |
          site="https://snakbillion.github.io/payproof-solana-prototype/"
          html=""
          for attempt in 1 2 3 4 5; do
            html="$(curl -fsSL "$site?v=$GITHUB_SHA")" &&               grep -q "PayProof | Invisible Commerce Proof Network" <<<"$html" && break
            sleep 5
          done
          grep -q "PayProof | Invisible Commerce Proof Network" <<<"$html"
          mapfile -t assets < <(
            grep -oE '(src|href)="[^"]+\.(js|css)"' <<<"$html" |
              sed -E 's/^(src|href)="//; s/"$//' | sort -u
          )
          test "${#assets[@]}" -gt 0
          for asset in "${assets[@]}"; do
            case "$asset" in
              https://*) asset_url="$asset" ;;
              /*) asset_url="https://snakbillion.github.io$asset" ;;
              *) asset_url="$site$asset" ;;
            esac
            echo "Checking $asset_url"
            curl -fsSL "$asset_url" > /dev/null
          done
