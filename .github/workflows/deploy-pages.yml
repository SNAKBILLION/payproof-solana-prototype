name: Verify and publish PayProof

on:
  push:
    branches:
      - source-v4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: payproof-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test protocol and rendered application
        run: pnpm test

      - name: Build GitHub Pages export
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /payproof-solana-prototype
        run: pnpm build

      - name: Package static export
        shell: bash
        run: |
          export_index="$(find . -maxdepth 5 -type f -name index.html ! -path './node_modules/*' ! -path './.git/*' | head -n 1)"
          if [ -z "$export_index" ]; then
            echo "No static index.html was produced."
            exit 1
          fi
          export_root="$(dirname "$export_index")"
          echo "Packaging GitHub Pages export from $export_root"
          mkdir -p pages-artifact
          cp -R "$export_root"/. pages-artifact/
          test -f pages-artifact/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy verified build
        id: deployment
        uses: actions/deploy-pages@v4
